services:
  - type: web
    name: bearingguardai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
